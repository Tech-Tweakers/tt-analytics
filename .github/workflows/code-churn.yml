name: "[GEN] - Code Churn Analysis"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repositorio a ser analisado'
        required: true

jobs:
  generate-churn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar script de churn
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: Tech-Tweakers
          REPO: ${{ github.event.inputs.repo }}
        run: python services/code-churn/main.py

      - name: Commitar resultados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "src/data/code_churn_${{ github.event.inputs.repo }}.js"
          git commit -m "Code Churn atualizado para ${{ github.event.inputs.repo }}" || echo "Nada novo"
          git push || echo "Nada para push"
