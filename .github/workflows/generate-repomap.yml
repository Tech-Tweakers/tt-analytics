name: "[GEN] - RepoMap Dinamico"

on:
  workflow_dispatch:

jobs:
  generate-repomap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Gerar repoMap
        run: |
          chmod +x services/generate-mdx/repomap-gen.sh
          services/generate-mdx/repomap-gen.sh

      - name: Commitar repoMap.js
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add src/data/repoMap.js
          git commit -m "Atualiza repoMap dinamicamente" || echo "Nada novo"
          git push || echo "Nada para push"
