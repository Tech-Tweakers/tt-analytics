name: "[GEN] - Rework Rate Analysis"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repositorio a ser analisado'
        required: true
        default: 'polaris-python-api'
      branch:
        description: 'Branch a ser analisada'
        required: true
        default: 'main'
      threshold:
        description: 'Numero minimo de alteracoes para contar como retrabalho'
        required: true
        default: '3'
      start_date:
        description: 'Data inicial (YYYY-MM-DD)'
        required: false
      end_date:
        description: 'Data final (YYYY-MM-DD)'
        required: false

jobs:
  analyze_rework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar analise de retrabalho
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: Tech-Tweakers
          REPO: ${{ github.event.inputs.repo }}
          BRANCH: ${{ github.event.inputs.branch }}
          THRESHOLD: ${{ github.event.inputs.threshold }}
          START_DATE: ${{ github.event.inputs.start_date || '2000-01-01' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
        run: python services/rework-rate/main.py

      - name: Commitar resultados
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add "src/data/rework_rate_${{ github.event.inputs.repo }}.js"
          git commit -m "Rework Rate atualizado para ${{ github.event.inputs.repo }}" || echo "Nada novo"
          git push || echo "Nada para push"
