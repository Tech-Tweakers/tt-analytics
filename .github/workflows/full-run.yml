name: "[GEN] - Full Repo Analysis & Deploy"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repositório a ser analisado'
        required: true
        default: 'polaris-python-api'
      branch:
        description: 'Branch a ser analisada'
        required: true
        default: 'main'
      threshold:
        description: 'Mínimo de alterações p/ retrabalho (Rework Rate)'
        required: true
        default: '3'
      start_date:
        description: 'Data inicial (YYYY-MM-DD) - opcional'
        required: false
      end_date:
        description: 'Data final (YYYY-MM-DD) - opcional'
        required: false

jobs:
  full_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout do repositório
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install requests pandas plotly kaleido

      - name: 📁 Gerar páginas MDX
        run: |
          export REPOS=${{ github.event.inputs.repo }}
          chmod +x services/generate-mdx/mdx-gen.sh
          services/generate-mdx/mdx-gen.sh
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull origin main --rebase || echo "⚠️ Pull falhou, seguindo mesmo assim"
          git add docs/
          git commit -m "📊 Cria nova página de métricas para $REPOS" || echo "⚠️ Nenhuma alteração para commitar"
          git push || echo "⚠️ Nenhuma alteração para push"

      - name: 🔁 Analisar Rework Rate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          export OWNER="Tech-Tweakers"
          export REPO=${{ github.event.inputs.repo }}
          export BRANCH=${{ github.event.inputs.branch }}
          export THRESHOLD=${{ github.event.inputs.threshold }}
          export START_DATE=${{ github.event.inputs.start_date || '2000-01-01' }}
          export END_DATE=${{ github.event.inputs.end_date || '' }}

          echo "📅 Rework: $START_DATE → $END_DATE"
          python services/rework-rate/main.py

          git add src/data/rework_rate_${REPO}.js
          git commit -m "🔄 Rework Rate atualizado para ${REPO}" || echo "⚠️ Nenhuma alteração para commitar"
          git push || echo "⚠️ Nenhuma alteração para push"

      - name: 🔁 Analisar Code Churn
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          export OWNER="Tech-Tweakers"
          export REPO=${{ github.event.inputs.repo }}

          python services/code-churn/main.py

          git add src/data/code_churn_${REPO}.js
          git commit -m "📊 Code Churn atualizado para ${REPO}" || echo "⚠️ Nenhuma alteração para commitar"
          git push || echo "⚠️ Nenhuma alteração para push"

      - name: 🔁 Analisar Refactor Rate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          export OWNER="Tech-Tweakers"
          export REPO=${{ github.event.inputs.repo }}
          export BRANCH=${{ github.event.inputs.branch }}
          export START_DATE=${{ github.event.inputs.start_date || '2000-01-01' }}
          export END_DATE=${{ github.event.inputs.end_date || '' }}

          python services/refactor-rate/main.py

          git add src/data/refactor_rate_${REPO}.js
          git commit -m "🔧 Refactor Rate atualizado para ${REPO}" || echo "⚠️ Nenhuma alteração para commitar"
          git push || echo "⚠️ Nenhuma alteração para push"

      - name: 🧠 Regenerar repoMap
        run: |
          chmod +x services/generate-mdx/repomap-gen.sh
          services/generate-mdx/repomap-gen.sh

          git add src/data/repoMap.js
          git commit -m "🧠 Atualiza repoMap após análises para $REPO" || echo "⚠️ Nada novo pra commitar"
          git push || echo "⚠️ Nenhuma alteração para push"

      - name: 🏗️ Build do Docusaurus
        run: npm ci && npm run build

      - name: 🚀 Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
